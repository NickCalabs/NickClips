services:
  web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD}
      - PGHOST=${PGHOST:-db}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-videoshare}
      - SESSION_SECRET=${SESSION_SECRET}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-1073741824}
      - FLASK_APP=${FLASK_APP:-main.py}
      - FLASK_ENV=${FLASK_ENV:-production}
      - SERVER_NAME=${SERVER_NAME:-localhost:5000}
      - MAX_VIDEOS_PER_USER=${MAX_VIDEOS_PER_USER:-50}
      - CONCURRENT_PROCESSING=${CONCURRENT_PROCESSING:-1}
      - YT_DLP_PROXY=${YT_DLP_PROXY:-}
      - YT_DLP_RATE_LIMIT=${YT_DLP_RATE_LIMIT:-500K}
      - YT_DLP_MAX_DURATION=${YT_DLP_MAX_DURATION:-3600}
      - YT_DLP_COOKIES=${YT_DLP_COOKIES:-}
      - PATH=/app/bin:/usr/local/bin:/usr/bin:/bin
      - VIRTUAL_HOST=${VIRTUAL_HOST:-}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - BASE_URL=https://nickclips.com
    volumes:
      - ${LOCAL_UPLOAD_PATH:-./uploads}:${UPLOAD_FOLDER:-/app/uploads}
      - ./docker-install-ytdlp.sh:/app/docker-install-ytdlp.sh
      - ./emergency_install_ytdlp.py:/app/emergency_install_ytdlp.py
      # Mount code for hot updates (no rebuild needed, just restart)
      - ./app.py:/app/app.py
      - ./main.py:/app/main.py
      - ./models.py:/app/models.py
      - ./routes.py:/app/routes.py
      - ./forms.py:/app/forms.py
      - ./downloader.py:/app/downloader.py
      - ./video_processor.py:/app/video_processor.py
      - ./templates:/app/templates
      - ./static:/app/static
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /app/bin

        # Check if yt-dlp already installed
        if command -v yt-dlp &> /dev/null || [ -x /app/bin/yt-dlp ]; then
          echo "yt-dlp already installed"
        elif [ -f /app/docker-install-ytdlp.sh ]; then
          echo "Installing yt-dlp via shell script..."
          chmod +x /app/docker-install-ytdlp.sh
          /app/docker-install-ytdlp.sh || echo "Shell install failed"
        elif [ -f /app/emergency_install_ytdlp.py ]; then
          echo "Installing yt-dlp via Python..."
          python /app/emergency_install_ytdlp.py || echo "Python install failed"
        fi

        echo "Starting application..."
        python migrations.py
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 300 main:app
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - videoshare-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_USER=${PGUSER:-postgres}
      - POSTGRES_DB=${PGDATABASE:-videoshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - videoshare-network

networks:
  videoshare-network:
    driver: bridge

volumes:
  postgres_data: {}
